# /etc/nginx/sites-available/tickettracker
#
# nginx is the only thing listening on the public internet. It:
#   1. serves the built Angular files straight from disk (fast, no .NET involved)
#   2. forwards /api/* to Kestrel, which listens only on 127.0.0.1:5080
# Browser <-> nginx is one origin, so there's no CORS and the auth cookie
# can be SameSite=Strict.
#
# deploy.sh never overwrites this file after the first install, because
# certbot (HTTPS, DEPLOY.md step 10) edits it in place.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                        # replace with your domain if you have one

    # "current" is a symlink that deploy.sh points at the newest release.
    root /var/www/tickettracker/current/web;
    index index.html;

    # Requests bigger than this are rejected before reaching the app.
    # The largest legitimate body is a ~4 KB ticket description.
    client_max_body_size 256k;

    # Basic hardening headers for every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                  # no embedding in iframes (clickjacking)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;     # no trailing slash: the /api/ prefix is passed through unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";       # allow keep-alive to Kestrel
        proxy_set_header Host $host;
        # The real client IP and scheme. The app trusts these headers only from
        # loopback (UseForwardedHeaders). $remote_addr REPLACES any
        # X-Forwarded-For the client sent, so it can't be spoofed to dodge the
        # login rate limit ($proxy_add_x_forwarded_for would append to it instead).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Angular's build output has content hashes in the file names
    # (main-XSPC2RDW.js), so a changed file always gets a new name. That makes it
    # safe to let browsers cache them for a year.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html is NOT hashed and points to the current hashed files, so it must
    # never be cached; otherwise users keep loading last week's app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: /tickets/42 isn't a file on disk; it's a route inside Angular.
    # Serve index.html and let the Angular router handle it. (Without this, a
    # refresh or a link from the escalation email would get a 404.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
